# Example harvester config — copy to harvester.yaml and edit as needed.
# Defaults below are tuned for the FMP Starter plan
# (300 calls/min, 20 GB/mo, 5y history, US coverage, annual fundamentals).
# Upgrade ``plan:`` below to remove the Starter-specific restrictions.

state_dir: ~/.aiofmp/cache
log_level: INFO
shutdown_grace_seconds: 30           # SIGINT grace before cancelling tasks

# FMP plan tier — controls rate-limit pacing, default symbol filter,
# per-endpoint paywall awareness, and which categories the manager
# auto-disables at start-up.
#
# Capabilities the harvester applies automatically when plan: starter:
#   - 300 RPM sliding-window rate limit
#   - Symbol catalogs filtered to US-listed instruments
#   - statements.key_metrics / .financial_ratios / .revenue_*_segmentation
#     skip period=quarter
#   - chart_intraday drops 1min (5min+ still allowed)
#   - news drops the press_releases variant
#   - analyst_estimates drops period=quarter
#   - form13f is skipped at start-up (entirely paywalled)
plan: starter                        # basic | starter | premium | ultimate

budget:
  monthly_soft_cap_gb: 18
  monthly_hard_cap_gb: 20
  soft_cap_behavior: pause_until_next_month   # | warn_only

retry:
  on_429:
    backoff_seconds: [60, 120, 240, 480]
    max_attempts: 4
  on_5xx:
    backoff_seconds: [10, 30, 60]
    max_attempts: 3

discovery:
  refresh_interval: 7d

categories:
  statements:
    enabled: true
    interval: 6h
    periods: [annual, quarter]       # quarter is auto-filtered to the 10 endpoints that allow it on Starter
    initial_limit: 40
    incremental_limit: 2
    safety_net_interval: 30d

  analyst_estimates:
    enabled: true
    interval: 24h
    estimate_periods: [annual]       # quarter is paywalled on Starter; will be dropped if listed
    max_backfill_years: 3
    page_size: 100

  analyst_snapshots:
    enabled: true
    interval: 24h
    include: [ratings_snapshot, price_target_consensus, price_target_summary, stock_grades_summary]

  chart_eod:
    enabled: true
    interval: 24h
    variants: [historical_price_full]
    backfill_years: 5                # Starter allows up to 5y; Premium/Ultimate allow 30y

  chart_intraday:
    enabled: false                   # opt-in: bandwidth-heavy
    interval: 4h
    timeframes: [5min, 15min, 30min, 1hour, 4hour]   # 1min auto-dropped on Starter
    backfill_days: 30

  technical_indicators:
    enabled: false                   # opt-in: derived series; cache on-demand instead
    interval: 24h
    indicators: []                   # e.g. [{method: simple_moving_average, period_length: 20, timeframe: 1day}]

  news:
    enabled: true
    interval: 30m
    variants: [general_news, stock_news, crypto_news, forex_news]   # press_releases auto-dropped on Starter
    backfill_days_initial: 30
    page_size: 100

  insider_trades:
    enabled: true
    interval: 6h
    max_pages: 200
    page_size: 100

  form13f:
    enabled: true                    # auto-skipped on Starter; will run on Premium+
    interval: 24h
    max_pages: 50
    page_size: 100

  economics:
    enabled: true
    interval: 24h
    # Use FMP's own indicator names; FRED codes (UNRATE/FEDFUNDS/DFF) return "Invalid name".
    indicators: [GDP, realGDP, CPI, inflationRate, consumerSentiment, unemploymentRate, federalFunds, retailSales]
    backfill_years: 5

  commodities_eod:
    enabled: true
    interval: 24h
    variants: [historical_price_full]
    backfill_years: 5
    # Note: only a subset of commodity symbols are accessible on Starter
    # (GCUSD, SIUSD work; CLUSD, HGUSD, NGUSD return 402). The paywall
    # short-circuit will catch sustained 402 sequences if you hit that wall.

  commodities_intraday:
    enabled: false
    interval: 4h
    timeframes: [5min, 15min, 30min, 1hour, 4hour]
    backfill_days: 30

  forex_eod:
    enabled: true
    interval: 24h
    variants: [historical_price_full]
    backfill_years: 5

  forex_intraday:
    enabled: false
    interval: 4h
    timeframes: [5min, 15min, 30min, 1hour, 4hour]
    backfill_days: 30

  indexes_eod:
    enabled: true
    interval: 24h
    variants: [historical_price_eod_full]
    backfill_years: 5
    # Note: only US indexes work on Starter; non-US (^AEX, ^N225, etc.) return
    # 402 even though they live in the indexes_list response.

  indexes_intraday:
    enabled: false
    interval: 4h
    timeframes: [5min, 15min, 30min, 1hour, 4hour]
    backfill_days: 30

  dcf:
    enabled: true
    interval: 24h
    include: [dcf_valuation, levered_dcf]
