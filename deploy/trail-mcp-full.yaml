# Trail MCP with LIVE data sources (FMP / EDGAR / GMD) on k3s, at http://trail-mcp.ws.local/mcp.
# Supersedes deploy/trail-mcp.yaml (the lean, provider-less variant).
#
# Prereq — create the credentials Secret first (NOT committed):
#   kubectl -n trail create secret generic trail-mcp-creds \
#     --from-literal=FMP_API_KEY="<your FMP key>" \
#     --from-literal=EDGAR_IDENTITY="Your Name your.email@example.com"
#
# Then: kubectl apply -f deploy/trail-mcp-full.yaml
# Use from a tool call: eval/describe/run with data = {"config": "/config/trail.yaml"}
---
apiVersion: v1
kind: Namespace
metadata: { name: trail }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: trail-mcp-config, namespace: trail }
data:
  trail.yaml: |
    # Credentials come from the environment (the trail-mcp-creds Secret); no secrets in this file.
    sources:
      edgar:
        driver: edgar
        options:
          cache_dir: /edgar-cache
          tickers: [AAPL, MSFT, NVDA, ORCL, CRM, GOOGL, META, DIS, NFLX, VZ, AMZN, HD, MCD, NKE, LOW, KO, PG, WMT, PEP, COST, JNJ, UNH, PFE, MRK, ABBV, XOM, CVX, COP, SLB, EOG, HON, UNP, CAT, GE, BA, JPM, BAC, WFC, GS]
      fmp:
        driver: fmp
        options:
          cached: true
          cache_dir: /cache                 # FMP Parquet cache — mounted from the fmp-cache local PV
          requests_per_minute: 300
          # The whole investable set FMP publishes statements for (~26k symbols, global and
          # multi-currency), discovered rather than hand-listed. Resolved once per cache_hours
          # and memoised to /cache, since entities() runs on every panel load.
          # NOTE: edgar stays on its short ticker list — it backfills richer meta for the
          # mega-caps; everything else is served by fmp.
          universe:
            kind: financial_symbols
            cache_hours: 24
      gmd:
        driver: gmd
        options:
          cache_dir: /gmd-cache
      scores:
        driver: scores
        options:
          dir: /scores                 # date-partitioned rating snapshots (MCP to_file writes; driver reads back)
    precedence:
      # Approach X: domain data is source-namespaced (edgar.*, fmp.*, gmd.*), so there are no shared
      # income/balance/cash namespaces to arbitrate. One default chain routes each namespaced field to
      # its owning source (matched by available_fields) and picks edgar-first for the shared meta.*.
      # Canonical statement names (revenue(), total_assets(), ...) come from `financial.trail`, which
      # coalesces edgar??fmp explicitly.
      default: [edgar, fmp, gmd, scores]
    panel:
      periods: [2015, 2025]            # rolling upper bound so fresh filings + today's scores enter the panel
      pit: auto
      strict: false
---
# --- Local volume for the existing FMP Parquet cache (2.5G at /home/.../aiofmp-cache/cache) ---
# A static `local` PV surfaces the EXISTING host directory into the pod. This is deliberately NOT
# the k3s default `local-path` (rancher.io/local-path) provisioner — that one dynamically carves a
# NEW empty dir under /var/lib/rancher, which would discard the pre-built 2.5G cache. A no-provisioner
# StorageClass + static PV binds the real directory instead.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: local-storage }
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer   # bind once a consuming pod is scheduled to the node
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fmp-cache-pv
  labels: { app: trail-mcp, data: fmp-cache }
spec:
  capacity: { storage: 10Gi }             # nominal; local PVs aren't size-enforced
  accessModes: [ReadWriteOnce]            # adapter reads Parquet and may append newly-fetched entries
  persistentVolumeReclaimPolicy: Retain   # never wipe the host cache on PVC delete
  storageClassName: local-storage
  local:
    path: /home/usmanshahid/Documents/aiofmp-cache/cache
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [uae-homenode] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: fmp-cache, namespace: trail }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-storage
  volumeName: fmp-cache-pv                 # bind directly to the PV above
  resources: { requests: { storage: 10Gi } }
---
# --- Scores volume: date-partitioned Parquet snapshots from the daily rating pipeline. Written by
# the MCP's server-side to_file and read back by the trail-scores driver as scores.*. This is NEW
# data (not a pre-existing host dir), so the k3s default `local-path` dynamic provisioner is fine.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: scores, namespace: trail }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trail-mcp
  namespace: trail
  labels: { app: trail-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: trail-mcp }
  template:
    metadata:
      labels: { app: trail-mcp }
    spec:
      containers:
        - name: trail-mcp
          image: 192.168.70.168:30500/trail-mcp-full:universe-1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: trail-mcp-creds }     # FMP_API_KEY, EDGAR_IDENTITY
          ports:
            - { containerPort: 3000, name: http }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: fmp-cache, mountPath: /cache }
            - { name: scores, mountPath: /scores }
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            # Measured: load peaks ~132Mi at 150 entities and grows ~0.04Mi/entity beyond that
            # (per-entity fetch; the resulting panel itself stays tiny), so the ~26k-symbol
            # universe projects to ~1.2Gi. 3Gi leaves headroom for a full-universe load.
            requests: { cpu: 50m, memory: 512Mi }
            limits: { memory: 3Gi }
      volumes:
        - name: config
          configMap: { name: trail-mcp-config }
        - name: fmp-cache
          persistentVolumeClaim:
            claimName: fmp-cache
        - name: scores
          persistentVolumeClaim:
            claimName: scores
---
apiVersion: v1
kind: Service
metadata: { name: trail-mcp, namespace: trail }
spec:
  selector: { app: trail-mcp }
  ports:
    - { port: 3000, targetPort: 3000, name: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: trail-mcp, namespace: trail }
spec:
  ingressClassName: traefik
  rules:
    - host: trail-mcp.ws.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trail-mcp
                port: { number: 3000 }
