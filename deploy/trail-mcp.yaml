# Trail MCP server on k3s, exposed via Traefik at http://trail-mcp.ws.local/mcp
# (dnsmasq: *.ws.local -> 192.168.70.168, the Traefik LB).
apiVersion: v1
kind: Namespace
metadata:
  name: trail
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trail-mcp
  namespace: trail
  labels: { app: trail-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: trail-mcp }
  template:
    metadata:
      labels: { app: trail-mcp }
    spec:
      containers:
        - name: trail-mcp
          image: 192.168.70.168:30500/trail-mcp:dac0ac2
          imagePullPolicy: IfNotPresent
          # Image CMD already runs: trail mcp --transport streamable-http --host 0.0.0.0 --port 3000
          ports:
            - { containerPort: 3000, name: http }
          readinessProbe:
            tcpSocket: { port: 3000 }   # /mcp needs POST + Accept headers; TCP connect is the right liveness signal
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: trail-mcp
  namespace: trail
spec:
  selector: { app: trail-mcp }
  ports:
    - { port: 3000, targetPort: 3000, name: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trail-mcp
  namespace: trail
spec:
  ingressClassName: traefik
  rules:
    - host: trail-mcp.ws.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trail-mcp
                port: { number: 3000 }
